name: CI

# OpenMW 0.51 Android port pipeline. All tooling comes from the Nix flake
# (NDK r28.2, SDK, JDK 17, cmake/ninja/ccache) — do not apt-install a
# toolchain here; buildscripts/ requires ANDROID_NDK_ROOT from the flake env.

on:
  push:
    branches: [openmw-0.51, master]
    tags: ['0.51.0-*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          gc-max-store-size: 12G

      - name: Cache host ICU 70.1
        uses: actions/cache@v6
        with:
          path: buildscripts/icu-host
          key: icu-host-70.1

      - name: Cache dependency prefix
        uses: actions/cache@v6
        with:
          path: |
            buildscripts/prefix
            buildscripts/downloads
          key: prefix-arm64-v8a-${{ hashFiles('buildscripts/CMakeLists.txt') }}

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-arm64-v8a-${{ github.sha }}
          restore-keys: ccache-arm64-v8a-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle') }}

      - name: Check out OpenMW 0.51 source
        run: git clone --branch openmw-0.51.0 --depth 1 https://github.com/OpenMW/openmw.git ../openmw-0.51

      - name: Build host ICU (required once for the ICU cross-build)
        run: nix develop -c bash buildscripts/build-icu-host.sh

      - name: Build native dependencies (arm64-v8a)
        run: nix develop -c bash -c 'cd buildscripts && ./build.sh --arch arm64 --ccache'

      - name: Build libopenmw.so + engine assets
        run: nix develop -c bash -c 'cd buildscripts && ./build-openmw.sh'

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          nix develop -c ./gradlew assembleNightlyDebug --stacktrace 2>&1 | tee gradle.log

      - name: Print gradle failure details
        if: failure()
        shell: bash
        run: |
          if [ -f gradle.log ]; then
            grep -nE "What went wrong|Caused by:|FAILED|error:" gradle.log | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            tail -25 gradle.log | while IFS= read -r l; do echo "::warning::$l"; done
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/nightly/debug/omw_debug_*.apk artifacts/
          find buildscripts/build/openmw-arm64 -name "libopenmw.so" \
            -exec cp "{}" artifacts/libopenmw-unstripped.so \;

      - uses: actions/upload-artifact@v4
        with:
          name: omw-debug-arm64-v8a
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/0.51.0-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: omw-debug-arm64-v8a

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "OpenMW for Android $TAG" --generate-notes
          gh release upload "$TAG" omw_debug_*.apk libopenmw-unstripped.so --clobber
