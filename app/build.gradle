plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

ext {
    versionFile = new File(project.rootDir, 'app/src/main/assets/libopenmw/resources/version')
    calculateVersion = {
        stream = new FileInputStream(versionFile)
        return stream.readLines()[0].trim() + "-" + project.android.defaultConfig.versionCode.toString()
    }
}

android {
    namespace 'com.libopenmw.openmw'
    compileSdk 34

    sourceSets {
        main {
            resources {
                // To include the wrap.sh script required by ASAN
                srcDir 'wrap/res'
            }
        }
    }

    defaultConfig {
        applicationId "is.xyz.omw"
        versionCode 51
        versionName calculateVersion()

        minSdk 21
        // Keep targetSdk below 30 for now to preserve the legacy
        // external-storage behavior the launcher relies on; bump only after
        // verifying the storage flow on real devices.
        targetSdk 29

        ndk {
            // other ABIs can be added once their native builds are revived
            abiFilters "arm64-v8a"
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            // Committed so CI releases sign with the same key as local
            // builds - runner-generated debug keystores would make every
            // release uninstall-reinstall. Standard debug key, not secret.
            storeFile rootProject.file('app/debug.keystore')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }

        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "version"

    productFlavors {
        mainline {
            dimension "version"
        }

        nightly {
            dimension "version"
            applicationId "is.xyz.omw_nightly"
            versionNameSuffix "-nightly"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "omw_${variant.buildType.name}_${calculateVersion()}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation project(':storagechooser')

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
